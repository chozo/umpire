<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1a2e" />
    <title>球審ジャッジ</title>
    <meta name="description" content="ストライクか、ボールか。球審になって、変化球がホームベースをかすめたかを見極めるブラウザゲーム。誤審3回で退場。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="球審ジャッジ" />
    <meta property="og:description" content="ストライクか、ボールか。球審になって、変化球がホームベースをかすめたかを見極めるブラウザゲーム。誤審3回で退場。" />
    <meta property="og:url" content="https://game.chozo.net/umpire/" />
    <meta property="og:image" content="https://game.chozo.net/umpire/ogp.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="球審ジャッジ — ストライクか、ボールか。変化球の軌跡と、真上から見たリプレイ画面" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="球審ジャッジ" />
    <meta name="twitter:description" content="ストライクか、ボールか。球審になって、変化球がホームベースをかすめたかを見極めるブラウザゲーム。誤審3回で退場。" />
    <meta name="twitter:image" content="https://game.chozo.net/umpire/ogp.png" />
    <meta name="twitter:image:alt" content="球審ジャッジ — ストライクか、ボールか。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="view">
        <canvas id="c"></canvas>

        <div id="hud" hidden>
          <div class="hud-lw">
            <div class="hud-l"><small>第</small><span id="hud-count">1</span><small>球</small></div>
            <span id="hud-hand"></span>
          </div>
          <div class="hud-r">
            <div id="hud-score">0</div>
            <div id="hud-miss"></div>
          </div>
        </div>
        <div id="timer" hidden><div id="timer-bar"></div></div>
        <div id="pitch-info" hidden></div>
        <div id="hint" hidden></div>
        <div id="call" hidden></div>
        <div id="verdict" hidden></div>
        <div id="replay-tag" hidden>REPLAY <small>判定検証</small><span class="skip">タップでスキップ</span></div>
        <div id="replay-text" hidden></div>

        <section id="title" class="screen">
          <div class="title-box">
            <div class="kicker">UMPIRE CHALLENGE</div>
            <h1>球審ジャッジ</h1>
            <p class="lead">キミの目でコールせよ。<br />ストライクか、ボールか。</p>
            <ul class="rules">
              <li><b>ボールの一部でもホームベースの上</b>を通ればストライク</li>
              <li>高さは関係なし。<b>左右だけ</b>で判定</li>
              <li>ミットに収まってから <b>1.5秒以内</b> にコール</li>
              <li><b>誤審3回で退場</b>するまで続く</li>
            </ul>
            <button id="btn-start" class="primary">プレイボール</button>
            <p class="keys">PC: <kbd>F</kbd> ボール ／ <kbd>J</kbd> ストライク ／ <kbd>M</kbd> BGM</p>
            <button class="bgm-toggle" type="button">BGM オン</button>
          </div>
        </section>

        <section id="result" class="screen" hidden>
          <div class="title-box">
            <div class="kicker" id="res-kicker">EJECTED</div>
            <h2 id="res-head">退場！</h2>
            <div class="rank" id="res-rank"></div>
            <div class="score-big"><span id="res-score">0</span><small>点</small></div>
            <dl class="stats">
              <dt>正解</dt><dd id="res-correct"></dd>
              <dt>際どい球</dt><dd id="res-close"></dd>
              <dt>自己ベスト</dt><dd id="res-best"></dd>
            </dl>
            <button id="btn-retry" class="primary">もう一度</button>
            <button id="btn-title" class="ghost">タイトルへ</button>
            <button class="bgm-toggle" type="button">BGM オン</button>
          </div>
        </section>
      </div>

      <div id="controls">
        <button id="btn-ball" class="call-btn ball idle"><span>ボール</span><small>F</small></button>
        <button id="btn-strike" class="call-btn strike idle"><span>ストライク</span><small>J</small></button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
